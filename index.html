<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AWS Services Map — learn how AWS fits together</title>
    <meta name="description" content="An interactive map of core AWS services, arranged like a real architecture, with typed relationships and guided tours. Built for Cloud Practitioner, Solutions Architect and Developer Associate prep.">
    <meta name="color-scheme" content="dark light">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230A0E1A'/%3E%3Cpath d='M9 22L16 10L23 22' stroke='%23A78BFA' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='9' cy='22' r='3.5' fill='%2338BDF8'/%3E%3Ccircle cx='16' cy='10' r='3.5' fill='%23FB923C'/%3E%3Ccircle cx='23' cy='22' r='3.5' fill='%2334D399'/%3E%3C/svg%3E">
    <script>
        // Set the theme before first paint to avoid a flash: stored choice, else system preference.
        (() => {
            let stored = null;
            try { stored = localStorage.getItem('aws-map-theme'); } catch { /* storage blocked */ }
            const system = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            document.documentElement.dataset.theme = stored === 'light' || stored === 'dark' ? stored : system;
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
</head>
<body>
    <a class="skip-link" href="#map-root">Skip to map</a>
    <div class="app">
        <header class="app-header">
            <div class="brand">
                <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
                    <path d="M9 22L16 10L23 22" />
                    <circle cx="9" cy="22" r="3.5" class="brand-node brand-node--a" />
                    <circle cx="16" cy="10" r="3.5" class="brand-node brand-node--b" />
                    <circle cx="23" cy="22" r="3.5" class="brand-node brand-node--c" />
                </svg>
                <div class="brand-text">
                    <h1 class="brand-title">AWS Services Map</h1>
                    <p class="brand-sub">Learn the core services and how they connect</p>
                </div>
            </div>

            <div class="search" role="search">
                <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="M16 16l4.5 4.5" /></svg>
                <input id="search" type="search" placeholder="Search services…" autocomplete="off" spellcheck="false" aria-label="Search services" aria-describedby="search-status">
                <span class="search-status" id="search-status" aria-live="polite"></span>
                <kbd class="search-kbd" aria-hidden="true">/</kbd>
            </div>

            <div class="header-actions">
                <button type="button" class="btn guide-btn" data-action="guide" aria-controls="panel" aria-expanded="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h6a2 2 0 012 2V19a2 2 0 00-2-2H4zM20 5.5h-6a2 2 0 00-2 2V19a2 2 0 012-2h6z" /></svg>
                    Guide
                </button>
                <button type="button" class="icon-btn" data-action="theme" aria-label="Toggle theme">
                    <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4" /></svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z" /></svg>
                </button>
            </div>
        </header>

        <main class="map-scroll">
            <div class="map-toolbar"></div>
            <div id="map-root" tabindex="-1"></div>
        </main>

        <aside class="panel" id="panel" aria-label="Details"></aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
