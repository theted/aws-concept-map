# Archetype A (static-s3.md in the private theted/infrastructure repo): the app is static files
# only, so it goes to S3 + CloudFront. The build-and-sync steps and the cache-header policy live in
# theted/workflows/.github/workflows/deploy-static.yml. This replaces the old Lambda container
# deploy, whose handler did nothing but serve dist/.
name: Deploy to S3

on:
  push:
    branches: [master]
  workflow_dispatch:

# One deploy at a time. The shared workflow deletes superseded objects in its later passes, so two
# overlapping runs could have the loser sweep assets the winner had just published. deploy-static.yml
# declares no concurrency of its own, and a called workflow runs inside this one, so this group
# covers it.
concurrency:
  group: deploy-s3
  cancel-in-progress: true

jobs:
  deploy:
    uses: theted/workflows/.github/workflows/deploy-static.yml@master
    with:
      # Matches .nvmrc.
      node-version: '20'
      # Tests gate the deploy; a failure stops the run before any credentials are configured.
      build-command: npm run test:run && npm run build
      dist-dir: dist
    secrets: inherit
